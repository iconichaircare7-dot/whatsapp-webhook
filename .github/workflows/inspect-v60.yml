name: Inspect V60 Targets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect webhook verification wiring without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('server.js').read_text(encoding='utf-8', errors='replace')
          lines = text.splitlines()

          targets = []
          for i, line in enumerate(lines, start=1):
              low = line.lower()
              if 'hub.verify_token' in low or 'hub.challenge' in low or ('app.get' in low and 'webhook' in low):
                  targets.append(i)

          print('=== WEBHOOK VERIFY DIAGNOSTIC (NO SECRET VALUES) ===')
          print('target_line_count=' + str(len(targets)))
          print('target_lines=' + ','.join(map(str, targets[:30])))

          windows = []
          for n in targets:
              start = max(1, n - 40)
              end = min(len(lines), n + 40)
              windows.extend(lines[start-1:end])
          window_text = '\n'.join(windows)

          env_names = sorted(set(re.findall(r'process\.env\.([A-Z][A-Z0-9_]*)', window_text)))
          print('nearby_process_env_names=' + (','.join(env_names) if env_names else 'NONE'))

          whole_env_verify = sorted(set(
              name for name in re.findall(r'process\.env\.([A-Z][A-Z0-9_]*)', text)
              if 'VERIFY' in name or 'WEBHOOK' in name or 'TOKEN' in name
          ))
          print('verify_related_env_names_anywhere=' + (','.join(whole_env_verify) if whole_env_verify else 'NONE'))

          identifiers = set()
          for line in windows:
              if 'verify_token' in line.lower() or 'verifytoken' in line.lower():
                  for ident in re.findall(r'\b[A-Za-z_$][A-Za-z0-9_$]*\b', line):
                      if 'verify' in ident.lower() or 'token' in ident.lower():
                          identifiers.add(ident)
          print('verify_identifiers=' + (','.join(sorted(identifiers)) if identifiers else 'NONE'))

          print('has_hub_verify_token=' + str('hub.verify_token' in text).lower())
          print('has_hub_challenge=' + str('hub.challenge' in text).lower())
          print('has_get_webhook=' + str(bool(re.search(r'app\.get\s*\(\s*[\'\"]\/webhook[\'\"]', text))).lower())
          print('=== END ===')
          PY
