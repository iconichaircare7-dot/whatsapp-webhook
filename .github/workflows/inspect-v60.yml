name: Inspect V60 Targets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect exact webhook verification route without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('server.js').read_text(encoding='utf-8', errors='replace').splitlines()
          targets = [i for i,l in enumerate(lines, start=1) if 'hub.verify_token' in l or 'hub.challenge' in l]
          if not targets:
              raise SystemExit('webhook verification route not found')

          start = max(1, min(targets) - 8)
          end = min(len(lines), max(targets) + 8)

          out = ['# Webhook Verify Route Diagnostic', '', f'lines={start}-{end}', '']
          for n in range(start, end + 1):
              line = lines[n-1]
              # Source code only. Do not resolve or print environment values.
              out.append(f'{n}: {line}')

          Path('WEBHOOK_VERIFY_ROUTE.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f'wrote source lines {start}-{end}; no secret values resolved')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WEBHOOK_VERIFY_ROUTE.md
          git commit -m "Record webhook verification route diagnostic" || true
          git push
